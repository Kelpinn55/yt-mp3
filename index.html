<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube & YT Music MP3 Downloader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1f1f1f;
            --accent: #ff0000;
            --accent-hover: #cc0000;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --success: #28a745;
            --success-hover: #218838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            border: 1px solid #282828;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            text-align: center;
        }

        .header-icon {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 18px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #121212;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button.btn-convert {
            padding: 15px 25px;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button.btn-convert:hover {
            background: var(--accent-hover);
        }

        #statusMsg {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .progress-container {
            display: none;
            margin-top: 20px;
            text-align: left;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        #resultCard {
            margin-top: 25px;
            background: #141414;
            padding: 24px;
            border-radius: 12px;
            display: none;
            border: 1px solid #2a2a2a;
        }

        .thumb {
            width: 100%;
            max-width: 250px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }

        .song-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            word-break: break-word;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: var(--success);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-download:hover {
            background: var(--success-hover);
        }

        .btn-alt {
            background: #2b5cff;
        }
        .btn-alt:hover {
            background: #1a49e0;
        }
    </style>
</head>
<body>

<div class="container">
    <i class="fab fa-youtube header-icon"></i>
    <h1>YT & YT Music MP3 Downloader</h1>
    <p class="subtitle">Konversi Audio Cepat (Anti-Stuck Multi-Engine)</p>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Tempel link https://music.youtube.com/watch?v=..." autocomplete="off">
        <button class="btn-convert" id="convertBtn" onclick="startConversion()">
            <i class="fas fa-sync-alt"></i> Convert
        </button>
    </div>

    <div class="progress-container" id="progressContainer">
        <div class="progress-label">
            <span id="progressText">Menghubungkan server...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
    </div>

    <div id="statusMsg"></div>

    <div id="resultCard">
        <img id="thumbnail" class="thumb" src="" alt="Thumbnail Lagu">
        <div id="songTitle" class="song-title">Lagu Terdeteksi</div>

        <a id="directDlBtn" class="btn-download" href="#" target="_blank" style="display:none;">
            <i class="fas fa-download"></i> Unduh File MP3 Asli
        </a>

        <div id="fallbackSection" style="display:none;">
            <a id="ssBtn" class="btn-download btn-alt" href="#" target="_blank">
                <i class="fas fa-bolt"></i> Download via SSYouTube
            </a>
            <a id="y2mBtn" class="btn-download" style="background:#e67e22;" href="#" target="_blank">
                <i class="fas fa-music"></i> Download via Y2Mate
            </a>
        </div>
    </div>
</div>

<script>
    let pollInterval = null;

    function extractVideoId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchWithTimeout(resource, options = {}, timeout = 7000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        const response = await fetch(resource, {
            ...options,
            signal: controller.signal
        });
        clearTimeout(id);
        return response;
    }

    async function startConversion() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        const progressContainer = document.getElementById('progressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const resultCard = document.getElementById('resultCard');
        const thumbnail = document.getElementById('thumbnail');
        const directDlBtn = document.getElementById('directDlBtn');
        const fallbackSection = document.getElementById('fallbackSection');

        if (pollInterval) clearInterval(pollInterval);

        if (!urlInput) {
            statusMsg.style.color = '#ff4444';
            statusMsg.innerText = 'Masukkan URL terlebih dahulu!';
            return;
        }

        const videoId = extractVideoId(urlInput);
        if (!videoId) {
            statusMsg.style.color = '#ff4444';
            statusMsg.innerText = 'URL tidak valid!';
            resultCard.style.display = 'none';
            progressContainer.style.display = 'none';
            return;
        }

        const cleanYtUrl = `https://www.youtube.com/watch?v=${videoId}`;
        thumbnail.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

        // Set fallback links
        document.getElementById('ssBtn').href = `https://ssyoutube.com/watch?v=${videoId}`;
        document.getElementById('y2mBtn').href = `https://y2mate.is/watch?v=${videoId}`;

        // Reset UI State
        statusMsg.innerText = '';
        resultCard.style.display = 'none';
        directDlBtn.style.display = 'none';
        fallbackSection.style.display = 'none';
        progressContainer.style.display = 'block';
        progressBarFill.style.width = '15%';
        progressPercent.innerText = '15%';
        progressText.innerText = 'Menghubungkan ke API...';

        try {
            // Mencoba API 1 dengan limit timeout 7 detik
            const searchUrl = `https://loader.to/api/ajax/search.php?format=mp3&url=${encodeURIComponent(cleanYtUrl)}`;
            const response = await fetchWithTimeout(searchUrl, {}, 7000);
            const data = await response.json();

            if (!data || !data.id) throw new Error('API Sibuk');

            const jobId = data.id;
            let attempts = 0;

            pollInterval = setInterval(async () => {
                attempts++;
                try {
                    const progressUrl = `https://loader.to/api/ajax/progress.php?id=${jobId}`;
                    const pRes = await fetchWithTimeout(progressUrl, {}, 5000);
                    const pData = await pRes.json();

                    if (pData.progress) {
                        const pct = Math.min(Math.round(pData.progress / 10), 100);
                        progressBarFill.style.width = `${pct}%`;
                        progressPercent.innerText = `${pct}%`;
                        progressText.innerText = 'Mengonversi Audio...';
                    }

                    if (pData.download_url) {
                        clearInterval(pollInterval);
                        progressBarFill.style.width = '100%';
                        progressPercent.innerText = '100%';

                        directDlBtn.href = pData.download_url;
                        directDlBtn.style.display = 'inline-flex';

                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                            resultCard.style.display = 'block';
                            statusMsg.style.color = '#28a745';
                            statusMsg.innerText = 'Konversi Berhasil!';
                        }, 400);
                    }

                    // Jika lebih dari 10x polling (15 detik) tidak ada respon download, lempar ke fallback
                    if (attempts > 10) throw new Error('Timeout Polling');

                } catch (e) {
                    clearInterval(pollInterval);
                    activateFallback();
                }
            }, 1500);

        } catch (error) {
            activateFallback();
        }

        function activateFallback() {
            progressContainer.style.display = 'none';
            resultCard.style.display = 'block';
            fallbackSection.style.display = 'block';
            statusMsg.style.color = '#aaa';
            statusMsg.innerText = 'API Direct sibuk. Silakan pilih mesin unduh di bawah ini:';
        }
    }
</script>

</body>
</html>
